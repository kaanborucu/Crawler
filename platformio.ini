[platformio]
default_envs = esp32-s3-mock

[env]
monitor_speed = 115200
upload_speed = 921600

[env:esp32-s3-mock]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; ESP32-S3 N16R8: 16 MB QSPI flash and 8 MB OPI PSRAM.
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.6
build_flags =
    -O3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DCRAWLER_USE_MOCK_HARDWARE=1
    -DCRAWLER_ENABLE_BLE=1
build_src_filter =
    -<*>
    +<main.cpp>
    +<crawler.cpp>
    +<policy_pipeline.cpp>
    +<robot_io.cpp>
    +<ble_control.cpp>
    +<safety.cpp>
    +<student_policy.c>

[env:esp32-s3-hardware]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.6
build_flags =
    -O3
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DCRAWLER_USE_MOCK_HARDWARE=0
    -DCRAWLER_ENABLE_BLE=1
build_src_filter =
    -<*>
    +<main.cpp>
    +<crawler.cpp>
    +<policy_pipeline.cpp>
    +<robot_io.cpp>
    +<ble_control.cpp>
    +<safety.cpp>
    +<student_policy.c>

[env:native-tests]
platform = native
build_type = debug
build_flags =
    -std=c++11
    -O2
    -DCRAWLER_USE_MOCK_HARDWARE=1
    -DCRAWLER_ENABLE_BLE=0
build_src_filter =
    -<*>
    +<native_test_main.cpp>
    +<policy_pipeline.cpp>
    +<robot_io.cpp>
    +<ble_control.cpp>
    +<safety.cpp>
    +<student_policy.c>
