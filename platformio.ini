[platformio]
default_envs = esp32-s3-mock-wifi-idf-httpd-iram-cache32

[env]
monitor_speed = 115200
upload_speed = 921600

[env:native-tests]
platform = native
build_type = debug
build_flags =
    -std=c++11
    -O2
    -DCRAWLER_USE_MOCK_HARDWARE=1
    -DCRAWLER_ENABLE_BLE=0
    -DCRAWLER_ENABLE_WIFI_TELEMETRY=0
build_src_filter =
    -<*>
    +<native_test_main.cpp>
    +<policy_pipeline.cpp>
    +<robot_io.cpp>
    +<imu_sensor.cpp>
    +<ble_control.cpp>
    +<safety.cpp>
    +<websocket_lifecycle.cpp>
    +<student_policy.c>

; Proven hybrid Arduino + ESP-IDF HTTPD configuration shared by the mock and
; hardware targets. This rebuilds Wi-Fi with IRAM optimization and uses the
; 32 KB cache / 32-byte cache-line configuration.
[crawler-wifi-idf-httpd-common]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino, espidf
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = config/partitions_16MB.csv
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.6
lib_ignore = WebSockets
build_flags =
    -O3
    ; NimBLE 2.5.x triggers this GCC 8 warning under ESP-IDF's -Werror=all.
    ; Disable the warning itself so option ordering cannot re-enable it.
    -Wno-int-in-bool-context
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DCRAWLER_ENABLE_BLE=1
    -DCRAWLER_ENABLE_WIFI_TELEMETRY=1
    -DCRAWLER_WIFI_USE_IDF_HTTPD=1
board_build.cmake_extra_args = "-DSDKCONFIG_DEFAULTS=config/sdkconfig.crawler-common.defaults;config/sdkconfig.wifi-iram.defaults;config/sdkconfig.cache32-line32.defaults;config/sdkconfig.httpd.defaults"

[env:esp32-s3-mock-wifi-idf-httpd-iram-cache32]
extends = crawler-wifi-idf-httpd-common
build_flags =
    ${crawler-wifi-idf-httpd-common.build_flags}
    -DCRAWLER_USE_MOCK_HARDWARE=1
    -DCRAWLER_ENFORCE_INFERENCE_DEADLINE=0

[env:esp32-s3-hardware-wifi-idf-httpd-iram-cache32]
extends = crawler-wifi-idf-httpd-common
build_flags =
    ${crawler-wifi-idf-httpd-common.build_flags}
    -DCRAWLER_USE_MOCK_HARDWARE=0
    -DCRAWLER_ENFORCE_INFERENCE_DEADLINE=1
